[workspace]
resolver = "2"
members = [
    "crates/epibrhx-core",
    "crates/epibrhx-sources",
    "crates/epibrhx-layout",
    "crates/epibrhx-app",
    "tools/schemagen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
epibrhx-core = { path = "crates/epibrhx-core" }
epibrhx-sources = { path = "crates/epibrhx-sources" }
epibrhx-layout = { path = "crates/epibrhx-layout" }

anyhow = "1"
dirs = "6"
insta = { version = "1", features = ["json"] }
petgraph = "0.8"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = "0.53"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
toml = "0.8"
web-time = "1"
tracing = "0.1"
gpui-kit = { version = "0.10.0", features = ["syntect"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
