<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RELIX — GPUI Kit WASM</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background: #ffffff;
        color: #111827;
      }
      body > canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        z-index: 1;
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
      }
      .error {
        color: #b91c1c;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <p>Loading RELIX WASM...</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
